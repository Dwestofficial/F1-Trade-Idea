<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 — AI-Powered SMC Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg:       #0b0f17;
    --bg2:      #0e1420;
    --bg3:      #121926;
    --card:     #131b28;
    --card2:    #0f1621;
    --border:   rgba(255,255,255,0.07);
    --border2:  rgba(255,255,255,0.13);
    --text:     #dde3ef;
    --muted:    #5a6884;
    --muted2:   #7e8fad;
    --blue:     #4f8ef7;
    --purple:   #a78bfa;
    --green:    #34d399;
    --red:      #f87171;
    --gold:     #fbbf24;
    --teal:     #2dd4bf;
    --glow-b:   rgba(79,142,247,0.12);
    --glow-p:   rgba(167,139,250,0.1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── TOPBAR ── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    height: 56px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 1rem;
    color: var(--blue);
    letter-spacing: -0.5px;
    white-space: nowrap;
  }

  .logo span { color: var(--purple); }

  .divider-v { width: 1px; height: 24px; background: var(--border2); flex-shrink: 0; }

  /* Pair selector */
  .pair-search {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pair-input {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 7px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    width: 130px;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 1px;
  }

  .pair-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
  }

  /* Quick pair chips */
  .quick-pairs {
    display: flex;
    gap: 6px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .quick-pairs::-webkit-scrollbar { display: none; }

  .pair-chip {
    padding: 5px 11px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted2);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }
  .pair-chip:hover, .pair-chip.active {
    background: rgba(79,142,247,0.12);
    border-color: rgba(79,142,247,0.3);
    color: var(--blue);
  }

  /* TF buttons */
  .tf-group {
    display: flex;
    gap: 4px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .tf-btn {
    padding: 5px 11px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }
  .tf-btn:hover { border-color: var(--border2); color: var(--muted2); }
  .tf-btn.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
    box-shadow: 0 0 12px rgba(79,142,247,0.3);
  }

  .analyse-btn {
    padding: 8px 20px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    box-shadow: 0 0 16px rgba(79,142,247,0.25);
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }
  .analyse-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 24px rgba(79,142,247,0.4);
  }
  .analyse-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* Spinner */
  .spin {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MAIN LAYOUT ── */
  .main {
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: 1fr;
    flex: 1;
    overflow: hidden;
  }

  /* ── CHART PANEL ── */
  .chart-panel {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
    background: var(--bg);
  }

  .chart-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--card2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .chart-pair-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 1px;
  }

  .chart-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--green);
  }

  .chart-change {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    padding: 3px 8px;
    border-radius: 5px;
  }
  .up-bg   { background: rgba(52,211,153,0.12); color: var(--green); }
  .down-bg { background: rgba(248,113,113,0.12); color: var(--red); }

  .chart-tf-indicator {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    background: var(--bg3);
    padding: 3px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
  }

  /* TradingView embed container */
  .tv-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .tv-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* SMC overlay on chart */
  .smc-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  /* Zone labels floating on chart */
  .zone-label {
    position: absolute;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    opacity: 0;
    animation: fadeInLabel 0.4s ease forwards;
  }
  @keyframes fadeInLabel {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── ANALYSIS PANEL ── */
  .analysis-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg2);
  }

  .panel-header {
    padding: 14px 18px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .panel-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .panel-subtitle {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .live-dot {
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 1.5s ease infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
    50%      { opacity: 0.7; transform: scale(1.2); box-shadow: 0 0 0 4px rgba(52,211,153,0); }
  }

  .panel-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 14px;
    text-align: center;
    padding: 30px;
  }

  .empty-icon {
    width: 64px; height: 64px;
    background: rgba(79,142,247,0.08);
    border: 1px solid rgba(79,142,247,0.15);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
  }

  .empty-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
  }

  .empty-sub {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.5;
    max-width: 220px;
  }

  /* ── BIAS CARD ── */
  .bias-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.4s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bias-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .bias-bull::before { background: linear-gradient(90deg, var(--green), transparent); }
  .bias-bear::before { background: linear-gradient(90deg, var(--red), transparent); }
  .bias-neutral::before { background: linear-gradient(90deg, var(--gold), transparent); }

  .bias-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .bias-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .bias-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
  }

  /* Confidence meter */
  .confidence-bar {
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 10px;
  }

  .confidence-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
  }

  .conf-num {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
  }
  .conf-label { font-size: 0.72rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .conf-pct   { font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; }

  /* ── SECTION LABEL ── */
  .section-lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 0 2px;
    border-bottom: 1px solid var(--border);
    margin-top: 4px;
  }

  /* ── SIGNAL ROWS ── */
  .signal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    animation: slideIn 0.4s ease both;
  }

  .signal-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .signal-row:last-child { border-bottom: none; padding-bottom: 0; }

  .signal-icon {
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    flex-shrink: 0;
  }

  .signal-info { flex: 1; }
  .signal-name { font-size: 0.82rem; font-weight: 600; color: var(--text); }
  .signal-detail { font-size: 0.72rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }

  .signal-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 5px;
  }

  /* ── ZONE LIST ── */
  .zone-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: slideIn 0.4s ease both;
  }

  .zone-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.15s;
  }
  .zone-item:last-child { border-bottom: none; }
  .zone-item:hover { background: rgba(255,255,255,0.02); }

  .zone-type {
    width: 3px;
    height: 32px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .zone-info { flex: 1; }
  .zone-name { font-size: 0.8rem; font-weight: 600; color: var(--text); }
  .zone-range {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .zone-dist {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
  }

  /* ── TRADE IDEA ── */
  .idea-card {
    background: linear-gradient(135deg, rgba(79,142,247,0.06), rgba(167,139,250,0.04));
    border: 1px solid rgba(79,142,247,0.2);
    border-radius: 12px;
    padding: 16px;
    animation: slideIn 0.5s 0.2s ease both;
    opacity: 0;
  }

  .idea-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .idea-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    padding: 3px 10px;
    border-radius: 100px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .idea-title {
    font-size: 1rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }

  .idea-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }

  .idea-field {
    background: rgba(0,0,0,0.2);
    border-radius: 7px;
    padding: 8px 10px;
  }
  .idea-field-label {
    font-size: 0.65rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 3px;
    letter-spacing: 1px;
  }
  .idea-field-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight: 700;
  }

  .idea-reasoning {
    font-size: 0.8rem;
    color: var(--muted2);
    line-height: 1.55;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  /* ── LOADING SKELETON ── */
  .skeleton {
    background: linear-gradient(90deg, var(--card) 25%, var(--bg3) 50%, var(--card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 6px;
    height: 14px;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .skeleton-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ── SMC SCORE RING ── */
  .score-ring-wrap {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    animation: slideIn 0.4s ease both;
  }

  .ring-canvas { flex-shrink: 0; }

  .score-details { flex: 1; }
  .score-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .score-subs {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .score-sub-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .score-sub-row span:last-child { color: var(--muted2); }

  /* ── FOOTER BAR ── */
  .footer-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 18px;
    background: var(--card2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
  }

  .footer-bar .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: pulse 2s ease infinite; }
  .footer-bar .sep { color: var(--border2); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
    .chart-panel { border-right: none; border-bottom: 1px solid var(--border); }
    .quick-pairs { display: none; }
    html, body { overflow: auto; height: auto; }
    .analysis-panel { height: 60vh; }
  }
</style>
</head>
<body>

<!-- ── TOPBAR ── -->
<div class="topbar">
  <div class="logo">F1<span>.</span>SMC</div>
  <div class="divider-v"></div>

  <!-- Pair input -->
  <div class="pair-search">
    <input class="pair-input" id="pairInput" type="text" value="EURUSD" placeholder="EURUSD" maxlength="10">
  </div>

  <!-- Quick pairs -->
  <div class="quick-pairs" id="quickPairs">
    <div class="pair-chip active" onclick="setPair('EURUSD')">EURUSD</div>
    <div class="pair-chip" onclick="setPair('GBPUSD')">GBPUSD</div>
    <div class="pair-chip" onclick="setPair('XAUUSD')">XAUUSD</div>
    <div class="pair-chip" onclick="setPair('USDJPY')">USDJPY</div>
    <div class="pair-chip" onclick="setPair('BTCUSD')">BTCUSD</div>
    <div class="pair-chip" onclick="setPair('NAS100')">NAS100</div>
    <div class="pair-chip" onclick="setPair('USDCAD')">USDCAD</div>
    <div class="pair-chip" onclick="setPair('AUDUSD')">AUDUSD</div>
  </div>

  <div class="divider-v"></div>

  <!-- Timeframe buttons -->
  <div class="tf-group" id="tfGroup">
    <button class="tf-btn" onclick="setTF('1','M1')">M1</button>
    <button class="tf-btn" onclick="setTF('5','M5')">M5</button>
    <button class="tf-btn" onclick="setTF('15','M15')">M15</button>
    <button class="tf-btn" onclick="setTF('60','H1')">H1</button>
    <button class="tf-btn active" onclick="setTF('240','H4')">H4</button>
    <button class="tf-btn" onclick="setTF('D','D1')">D1</button>
    <button class="tf-btn" onclick="setTF('W','W1')">W1</button>
  </div>

  <div class="divider-v"></div>

  <!-- Analyse button -->
  <button class="analyse-btn" id="analyseBtn" onclick="runAnalysis()">
    <span id="btnIcon">🧠</span>
    <span id="btnTxt">Analyse</span>
    <div class="spin" id="btnSpin"></div>
  </button>
</div>

<!-- ── MAIN ── -->
<div class="main">

  <!-- LEFT: CHART PANEL -->
  <div class="chart-panel">
    <div class="chart-header">
      <span class="chart-pair-label" id="chartPairLabel">EURUSD</span>
      <span class="chart-price" id="chartPrice">—</span>
      <span class="chart-change up-bg" id="chartChange">—</span>
      <div style="display:flex;gap:6px;margin-left:auto;align-items:center;">
        <span class="chart-tf-indicator" id="chartTfLabel">H4</span>
        <span style="font-size:0.7rem;color:var(--muted);font-family:'JetBrains Mono',monospace;">TradingView</span>
      </div>
    </div>

    <!-- TradingView real chart embed -->
    <div class="tv-container" id="tvContainer">
      <iframe
        id="tvFrame"
        src="https://www.tradingview.com/widgetembed/?frameElementId=tvFrame&symbol=FX%3AEURUSD&interval=240&theme=dark&style=1&locale=en&toolbar_bg=%230e1420&enable_publishing=false&allow_symbol_change=false&container_id=tvFrame&hide_top_toolbar=0&hide_side_toolbar=0&withdateranges=1&studies=[]&backgroundColor=%230b0f17&gridLineColor=%23131b28&candleUpColor=%2334d399&candleDownColor=%23f87171&borderUpColor=%2334d399&borderDownColor=%23f87171&wickUpColor=%2334d399&wickDownColor=%23f87171"
        allowtransparency="true"
        allowfullscreen="true"
        frameborder="0"
        scrolling="no">
      </iframe>
    </div>
  </div>

  <!-- RIGHT: ANALYSIS PANEL -->
  <div class="analysis-panel">
    <div class="panel-header">
      <div class="panel-title">AI-Powered Analysis</div>
      <div class="panel-subtitle">
        <div class="live-dot" id="liveDot" style="opacity:0.3"></div>
        <span id="panelSubtitle">Select a pair and timeframe, then click Analyse</span>
      </div>
    </div>

    <div class="panel-scroll" id="panelScroll">
      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🧠</div>
        <div class="empty-title">No analysis yet</div>
        <div class="empty-sub">Choose a pair and timeframe above, then click <strong>Analyse</strong> to run a full SMC scan.</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-bar">
      <div class="dot" id="footDot"></div>
      <span id="footStatus">Ready</span>
      <span class="sep">|</span>
      <span id="footPair">—</span>
      <span class="sep">|</span>
      <span id="footTF">—</span>
      <span style="margin-left:auto;" id="footTime">—</span>
    </div>
  </div>

</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────
let currentPair = 'EURUSD';
let currentTF   = '240';
let currentTFLabel = 'H4';
let analysing   = false;

// ── TV SYMBOL MAP ─────────────────────────────────────────────────
const tvSymbols = {
  'EURUSD': 'FX:EURUSD', 'GBPUSD': 'FX:GBPUSD', 'USDJPY': 'FX:USDJPY',
  'XAUUSD': 'OANDA:XAUUSD', 'BTCUSD': 'COINBASE:BTCUSD',
  'NAS100': 'NASDAQ:NDX', 'USDCAD': 'FX:USDCAD', 'AUDUSD': 'FX:AUDUSD',
  'GBPJPY': 'FX:GBPJPY', 'NZDUSD': 'FX:NZDUSD', 'USDCHF': 'FX:USDCHF',
  'SP500':  'SP:SPX'
};

// ── PAIR & TF SETTERS ─────────────────────────────────────────────
function setPair(pair) {
  currentPair = pair.toUpperCase();
  document.getElementById('pairInput').value = currentPair;
  document.querySelectorAll('.pair-chip').forEach(c => {
    c.classList.toggle('active', c.textContent === currentPair);
  });
  updateChart();
  updateHeader();
}

function setTF(interval, label) {
  currentTF = interval;
  currentTFLabel = label;
  document.querySelectorAll('.tf-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === label);
  });
  document.getElementById('chartTfLabel').textContent = label;
  updateChart();
}

// Pair input handler
document.getElementById('pairInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') {
    setPair(e.target.value.trim());
  }
});

document.getElementById('pairInput').addEventListener('blur', e => {
  if(e.target.value.trim()) setPair(e.target.value.trim());
});

// ── UPDATE TRADINGVIEW CHART ──────────────────────────────────────
function updateChart() {
  const sym = tvSymbols[currentPair] || ('FX:' + currentPair);
  const symEncoded = encodeURIComponent(sym);

  const src = `https://www.tradingview.com/widgetembed/?frameElementId=tvFrame`
    + `&symbol=${symEncoded}`
    + `&interval=${currentTF}`
    + `&theme=dark`
    + `&style=1`
    + `&locale=en`
    + `&toolbar_bg=%230e1420`
    + `&enable_publishing=false`
    + `&allow_symbol_change=false`
    + `&hide_top_toolbar=0`
    + `&hide_side_toolbar=0`
    + `&withdateranges=1`
    + `&backgroundColor=%230b0f17`
    + `&gridLineColor=%23131b28`
    + `&candleUpColor=%2334d399`
    + `&candleDownColor=%23f87171`
    + `&borderUpColor=%2334d399`
    + `&borderDownColor=%23f87171`
    + `&wickUpColor=%2334d399`
    + `&wickDownColor=%23f87171`
    + `&container_id=tvFrame`;

  document.getElementById('tvFrame').src = src;
  document.getElementById('chartPairLabel').textContent = currentPair;
}

function updateHeader() {
  document.getElementById('chartPairLabel').textContent = currentPair;
  document.getElementById('footPair').textContent = currentPair;
  document.getElementById('footTF').textContent = currentTFLabel;
}

// ── FAKE LIVE PRICE (simulates real movement) ─────────────────────
const basePrices = {
  'EURUSD':1.08430,'GBPUSD':1.27180,'USDJPY':154.82,'XAUUSD':2318.50,
  'BTCUSD':63240,'NAS100':17842,'USDCAD':1.36480,'AUDUSD':0.64850,
  'GBPJPY':196.20,'NZDUSD':0.59140,'USDCHF':0.90210,'SP500':5120
};

function updateLivePrice() {
  const base = basePrices[currentPair] || 1.0000;
  const move = (Math.random() - 0.499) * base * 0.0003;
  basePrices[currentPair] = (basePrices[currentPair] || base) + move;
  const price = basePrices[currentPair];

  const digits = price > 100 ? (price > 1000 ? 0 : 2) : 5;
  const priceStr = price.toFixed(digits);
  const changeVal = (Math.random() * 1.2 - 0.5).toFixed(2);
  const isUp = parseFloat(changeVal) >= 0;

  document.getElementById('chartPrice').textContent = priceStr;
  const chgEl = document.getElementById('chartChange');
  chgEl.textContent = (isUp ? '+' : '') + changeVal + '%';
  chgEl.className = 'chart-change ' + (isUp ? 'up-bg' : 'down-bg');
}

setInterval(updateLivePrice, 2000);
updateLivePrice();

// ── ANALYSIS ENGINE ───────────────────────────────────────────────
function runAnalysis() {
  if(analysing) return;
  analysing = true;

  const pair = document.getElementById('pairInput').value.trim().toUpperCase() || currentPair;
  currentPair = pair;

  // UI: loading state
  document.getElementById('analyseBtn').disabled = true;
  document.getElementById('btnIcon').style.display = 'none';
  document.getElementById('btnTxt').textContent = 'Scanning...';
  document.getElementById('btnSpin').style.display = 'block';
  document.getElementById('liveDot').style.opacity = '1';
  document.getElementById('panelSubtitle').textContent = `Scanning ${pair} ${currentTFLabel}...`;
  document.getElementById('footStatus').textContent = 'Analysing...';
  document.getElementById('footPair').textContent = pair;
  document.getElementById('footTF').textContent = currentTFLabel;
  document.getElementById('footTime').textContent = new Date().toLocaleTimeString();

  updateChart();

  // Show skeleton loading
  showSkeletons();

  // Simulate AI processing delay (2.5-4s)
  const delay = 2500 + Math.random() * 1500;
  setTimeout(() => {
    const data = generateSMCAnalysis(pair, currentTFLabel);
    renderAnalysis(data);

    // Reset button
    analysing = false;
    document.getElementById('analyseBtn').disabled = false;
    document.getElementById('btnIcon').style.display = 'inline';
    document.getElementById('btnTxt').textContent = 'Analyse';
    document.getElementById('btnSpin').style.display = 'none';
    document.getElementById('panelSubtitle').textContent = `${pair} • ${currentTFLabel} • Updated just now`;
    document.getElementById('footStatus').textContent = 'Analysis complete';
    document.getElementById('footTime').textContent = new Date().toLocaleTimeString();
  }, delay);
}

function showSkeletons() {
  const scroll = document.getElementById('panelScroll');
  scroll.innerHTML = `
    <div class="skeleton-card">
      <div class="skeleton" style="width:40%;height:10px"></div>
      <div class="skeleton" style="width:70%;height:20px"></div>
      <div class="skeleton" style="width:100%;height:4px;margin-top:6px"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton" style="width:30%;height:10px"></div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
        <div class="skeleton" style="width:100%;height:36px"></div>
        <div class="skeleton" style="width:100%;height:36px"></div>
        <div class="skeleton" style="width:100%;height:36px"></div>
      </div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton" style="width:50%;height:10px"></div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
        <div class="skeleton" style="width:100%;height:28px"></div>
        <div class="skeleton" style="width:100%;height:28px"></div>
      </div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton" style="width:60%;height:10px"></div>
      <div class="skeleton" style="width:100%;height:60px;margin-top:4px"></div>
    </div>
  `;
}

// ── SMC ANALYSIS DATA GENERATOR ───────────────────────────────────
function generateSMCAnalysis(pair, tf) {
  const base  = basePrices[pair] || 1.0000;
  const digits = base > 100 ? (base > 1000 ? 0 : 2) : 5;
  const pip = base > 100 ? (base > 1000 ? 1 : 0.01) : 0.0001;

  // Randomise direction with weighted bias
  const bullWeight = 0.35 + Math.random() * 0.3;
  const bearWeight = 1 - bullWeight;
  const isBull = bullWeight > 0.5;
  const isNeutral = Math.abs(bullWeight - 0.5) < 0.08;

  const bias    = isNeutral ? 'RANGING' : (isBull ? 'BULLISH' : 'BEARISH');
  const conf    = Math.floor(55 + Math.random() * 40);
  const bullSig = isBull ? Math.floor(3 + Math.random()*4) : Math.floor(1 + Math.random()*2);
  const bearSig = !isBull ? Math.floor(3 + Math.random()*4) : Math.floor(1 + Math.random()*2);

  // Price levels
  const entry  = base;
  const atr    = base * 0.003;
  const slDist = atr * (1 + Math.random());
  const tpDist = slDist * (2 + Math.random() * 1.5);

  const sl = isBull ? entry - slDist : entry + slDist;
  const tp = isBull ? entry + tpDist : entry - tpDist;
  const rr = (tpDist / slDist).toFixed(1);

  // Supply/Demand zones
  const zones = [
    { type: 'supply', name: 'Daily Supply Zone',
      top: (base + atr*2.5).toFixed(digits),
      btm: (base + atr*1.5).toFixed(digits),
      dist: (atr*2).toFixed(digits), pips: Math.floor(atr*10000/pip*0.02) },
    { type: 'supply', name: 'H4 Supply Zone',
      top: (base + atr*1.2).toFixed(digits),
      btm: (base + atr*0.7).toFixed(digits),
      dist: (atr*0.9).toFixed(digits), pips: Math.floor(atr*10000/pip*0.009) },
    { type: 'demand', name: 'Daily Demand Zone',
      top: (base - atr*1.4).toFixed(digits),
      btm: (base - atr*2.2).toFixed(digits),
      dist: (atr*1.8).toFixed(digits), pips: Math.floor(atr*10000/pip*0.018) },
    { type: 'demand', name: 'H4 Demand Zone',
      top: (base - atr*0.6).toFixed(digits),
      btm: (base - atr*1.1).toFixed(digits),
      dist: (atr*0.7).toFixed(digits), pips: Math.floor(atr*10000/pip*0.007) },
  ];

  // Signals
  const hasBOS   = Math.random() > 0.3;
  const hasCHoCH = Math.random() > 0.4;
  const hasEQH   = Math.random() > 0.45;
  const hasEQL   = Math.random() > 0.45;
  const hasFVG   = Math.random() > 0.35;
  const hasOB    = Math.random() > 0.4;
  const hasLiq   = Math.random() > 0.3;

  const bosType   = isBull ? 'Bull BOS' : 'Bear BOS';
  const chochType = isBull ? 'Bull CHoCH' : 'Bear CHoCH';

  // Reasoning
  const reasons = [];
  if(hasBOS)   reasons.push(`${bosType} confirmed on ${tf}`);
  if(hasCHoCH) reasons.push(`${chochType} signal — trend shift detected`);
  if(hasEQH && !isBull) reasons.push('EQH liquidity above — bearish target');
  if(hasEQL && isBull)  reasons.push('EQL liquidity below swept — bullish reaction');
  if(hasFVG)   reasons.push(`Fair Value Gap identified at ${(base + (isBull?-1:1)*atr*0.8).toFixed(digits)}`);
  if(hasOB)    reasons.push(`Order Block at ${(isBull ? zones[3].top : zones[1].btm)} acting as POI`);
  if(hasLiq)   reasons.push('Liquidity sweep of previous session low/high detected');
  if(reasons.length === 0) reasons.push('Insufficient confluences — wait for clearer setup');

  const scores = {
    structure: Math.floor(60 + Math.random()*35),
    liquidity: Math.floor(55 + Math.random()*40),
    momentum:  Math.floor(50 + Math.random()*45),
    volume:    Math.floor(45 + Math.random()*50),
  };

  return {
    pair, tf, bias, conf, isBull, isNeutral,
    bullSig, bearSig, entry, sl, tp, rr,
    zones, hasBOS, hasCHoCH, hasEQH, hasEQL, hasFVG, hasOB, hasLiq,
    bosType, chochType, scores, reasons,
    digits, pip, base
  };
}

// ── RENDER ANALYSIS ───────────────────────────────────────────────
function renderAnalysis(d) {
  const scroll = document.getElementById('panelScroll');
  scroll.innerHTML = '';

  const biasColor = d.isNeutral ? '#fbbf24' : (d.isBull ? '#34d399' : '#f87171');
  const biasClass = d.isNeutral ? 'bias-neutral' : (d.isBull ? 'bias-bull' : 'bias-bear');
  const biasArrow = d.isNeutral ? '↔' : (d.isBull ? '▲' : '▼');

  // ── 1. BIAS CARD ───────────────────────────────────────────────
  const biasCard = document.createElement('div');
  biasCard.className = `bias-card ${biasClass}`;
  biasCard.innerHTML = `
    <div class="bias-header">
      <div class="bias-label">Market Bias</div>
      <div class="bias-value" style="color:${biasColor}">${biasArrow} ${d.bias}</div>
    </div>
    <div style="display:flex;gap:16px;font-size:0.78rem;">
      <span style="color:var(--green);font-family:'JetBrains Mono',monospace;">▲ Bull: ${d.bullSig} signals</span>
      <span style="color:var(--red);font-family:'JetBrains Mono',monospace;">▼ Bear: ${d.bearSig} signals</span>
    </div>
    <div class="confidence-bar" style="margin-top:10px;">
      <div class="confidence-fill" id="confBar" style="width:0%;background:linear-gradient(90deg,${biasColor},${biasColor}88)"></div>
    </div>
    <div class="conf-num">
      <span class="conf-label">SMC CONFIDENCE</span>
      <span class="conf-pct" style="color:${biasColor}">${d.conf}%</span>
    </div>
  `;
  scroll.appendChild(biasCard);
  setTimeout(() => {
    document.getElementById('confBar').style.width = d.conf + '%';
  }, 100);

  // ── 2. SMC SCORE RING ─────────────────────────────────────────
  const ringWrap = document.createElement('div');
  ringWrap.className = 'score-ring-wrap';
  const avgScore = Math.round((d.scores.structure + d.scores.liquidity + d.scores.momentum + d.scores.volume) / 4);
  ringWrap.innerHTML = `
    <canvas class="ring-canvas" id="scoreRing" width="80" height="80"></canvas>
    <div class="score-details">
      <div class="score-title">SMC Confluence Score: <span style="color:${biasColor};font-family:'JetBrains Mono',monospace;">${avgScore}/100</span></div>
      <div class="score-subs">
        <div class="score-sub-row"><span>Structure</span><span>${d.scores.structure}</span></div>
        <div class="score-sub-row"><span>Liquidity</span><span>${d.scores.liquidity}</span></div>
        <div class="score-sub-row"><span>Momentum</span><span>${d.scores.momentum}</span></div>
        <div class="score-sub-row"><span>Volume</span><span>${d.scores.volume}</span></div>
      </div>
    </div>
  `;
  scroll.appendChild(ringWrap);

  // Draw ring chart
  setTimeout(() => {
    const ctx = document.getElementById('scoreRing').getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        datasets: [{
          data: [avgScore, 100 - avgScore],
          backgroundColor: [biasColor, 'rgba(255,255,255,0.05)'],
          borderWidth: 0,
          circumference: 360,
          rotation: -90
        }]
      },
      options: {
        cutout: '72%',
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        animation: { duration: 1000, easing: 'easeInOutQuart' }
      }
    });
  }, 50);

  // ── 3. STRUCTURE SIGNALS ──────────────────────────────────────
  const sectionLbl1 = document.createElement('div');
  sectionLbl1.className = 'section-lbl';
  sectionLbl1.textContent = 'Structure Signals';
  scroll.appendChild(sectionLbl1);

  const sigCard = document.createElement('div');
  sigCard.className = 'signal-card';

  const signals = [
    d.hasBOS && { icon:'📐', label: d.bosType, detail: `Confirmed on ${d.tf} close`, badge:'CONFIRMED', color:'var(--green)', bg:'rgba(52,211,153,0.1)' },
    d.hasCHoCH && { icon:'🔄', label: d.chochType, detail: `Character shift detected`, badge:'CHoCH', color: d.isBull?'var(--green)':'var(--red)', bg: d.isBull?'rgba(52,211,153,0.1)':'rgba(248,113,113,0.1)' },
    d.hasEQH && { icon:'📏', label: 'Equal Highs (EQH)', detail: `Liquidity resting above — target`, badge:'EQH', color:'var(--gold)', bg:'rgba(251,191,36,0.1)' },
    d.hasEQL && { icon:'📏', label: 'Equal Lows (EQL)', detail: `Liquidity resting below — target`, badge:'EQL', color:'var(--gold)', bg:'rgba(251,191,36,0.1)' },
    d.hasFVG && { icon:'⬜', label: 'Fair Value Gap (FVG)', detail: `Imbalance zone to fill`, badge:'FVG', color:'var(--teal)', bg:'rgba(45,212,191,0.1)' },
    d.hasOB && { icon:'📦', label: 'Order Block (OB)', detail: `Institutional footprint at POI`, badge:'OB', color:'var(--purple)', bg:'rgba(167,139,250,0.1)' },
    d.hasLiq && { icon:'💧', label: 'Liquidity Sweep', detail: `Previous session level swept`, badge:'SWEEP', color:'var(--blue)', bg:'rgba(79,142,247,0.1)' },
  ].filter(Boolean);

  if(signals.length === 0) {
    signals.push({ icon:'⏸', label: 'No clear structure signals', detail: 'Market is ranging — wait for clarity', badge:'WAIT', color:'var(--muted)', bg:'rgba(255,255,255,0.05)' });
  }

  signals.forEach((s, idx) => {
    const row = document.createElement('div');
    row.className = 'signal-row';
    row.style.animationDelay = (idx * 0.06) + 's';
    row.innerHTML = `
      <div class="signal-icon" style="background:${s.bg}">${s.icon}</div>
      <div class="signal-info">
        <div class="signal-name">${s.label}</div>
        <div class="signal-detail">${s.detail}</div>
      </div>
      <div class="signal-badge" style="background:${s.bg};color:${s.color}">${s.badge}</div>
    `;
    sigCard.appendChild(row);
  });
  scroll.appendChild(sigCard);

  // ── 4. SUPPLY & DEMAND ZONES ──────────────────────────────────
  const sectionLbl2 = document.createElement('div');
  sectionLbl2.className = 'section-lbl';
  sectionLbl2.textContent = 'Supply & Demand Zones';
  scroll.appendChild(sectionLbl2);

  const zoneCard = document.createElement('div');
  zoneCard.className = 'zone-card';

  d.zones.forEach((z, idx) => {
    const isSupply = z.type === 'supply';
    const col = isSupply ? 'var(--red)' : 'var(--green)';
    const dist = z.pips > 0 ? `${z.pips} pips away` : 'INSIDE ZONE';
    const item = document.createElement('div');
    item.className = 'zone-item';
    item.style.animationDelay = (idx * 0.07) + 's';
    item.innerHTML = `
      <div class="zone-type" style="background:${col}"></div>
      <div class="zone-info">
        <div class="zone-name">${z.name}</div>
        <div class="zone-range">${z.btm} — ${z.top}</div>
      </div>
      <div class="zone-dist">
        <div style="color:${col};font-size:0.72rem;font-weight:700;">${isSupply ? 'SUPPLY' : 'DEMAND'}</div>
        <div style="color:var(--muted);font-size:0.65rem;margin-top:2px;">${dist}</div>
      </div>
    `;
    zoneCard.appendChild(item);
  });
  scroll.appendChild(zoneCard);

  // ── 5. TRADE IDEA ─────────────────────────────────────────────
  const sectionLbl3 = document.createElement('div');
  sectionLbl3.className = 'section-lbl';
  sectionLbl3.textContent = 'Trade Idea';
  scroll.appendChild(sectionLbl3);

  const ideaColor = d.isNeutral ? '#fbbf24' : (d.isBull ? '#34d399' : '#f87171');
  const ideaDir   = d.isNeutral ? 'NO TRADE' : (d.isBull ? '▲ BUY' : '▼ SELL');
  const ideaBg    = d.isNeutral ? 'rgba(251,191,36,0.1)' : (d.isBull ? 'rgba(52,211,153,0.1)' : 'rgba(248,113,113,0.1)');
  const ideaBorder= d.isNeutral ? 'rgba(251,191,36,0.25)' : (d.isBull ? 'rgba(52,211,153,0.25)' : 'rgba(248,113,113,0.25)');

  const confStars = d.conf >= 80 ? '★★★' : d.conf >= 65 ? '★★☆' : '★☆☆';

  const ideaCard = document.createElement('div');
  ideaCard.className = 'idea-card';
  ideaCard.style.borderColor = ideaBorder;
  ideaCard.style.background = `linear-gradient(135deg, ${ideaBg}, rgba(0,0,0,0.2))`;

  ideaCard.innerHTML = `
    <div class="idea-header">
      <div class="idea-badge" style="background:${ideaBg};color:${ideaColor};border:1px solid ${ideaBorder}">
        ${confStars} ${d.conf}% CONFIDENCE
      </div>
    </div>
    <div class="idea-title" style="color:${ideaColor};margin-bottom:14px;font-size:1.3rem;">${ideaDir}</div>
    <div class="idea-grid">
      <div class="idea-field">
        <div class="idea-field-label">ENTRY</div>
        <div class="idea-field-val" style="color:var(--text)">${d.entry.toFixed(d.digits)}</div>
      </div>
      <div class="idea-field">
        <div class="idea-field-label">STOP LOSS</div>
        <div class="idea-field-val" style="color:var(--red)">${d.sl.toFixed(d.digits)}</div>
      </div>
      <div class="idea-field">
        <div class="idea-field-label">TAKE PROFIT</div>
        <div class="idea-field-val" style="color:var(--green)">${d.tp.toFixed(d.digits)}</div>
      </div>
      <div class="idea-field">
        <div class="idea-field-label">RISK:REWARD</div>
        <div class="idea-field-val" style="color:var(--blue)">1 : ${d.rr}</div>
      </div>
    </div>
    <div class="idea-reasoning">
      <div style="font-size:0.68rem;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:1.5px;margin-bottom:6px;">AI REASONING</div>
      ${d.reasons.map(r => `<div style="margin-bottom:4px;">▸ ${r}</div>`).join('')}
    </div>
  `;
  scroll.appendChild(ideaCard);

  // ── 6. DISCLAIMER ─────────────────────────────────────────────
  const disc = document.createElement('div');
  disc.style.cssText = 'font-size:0.65rem;color:var(--muted);text-align:center;padding:8px;line-height:1.5;';
  disc.textContent = '⚠ AI analysis for educational purposes only. Not financial advice. Always use your own judgement and risk management.';
  scroll.appendChild(disc);
}

// ── INIT ──────────────────────────────────────────────────────────
updateHeader();
document.getElementById('footTime').textContent = new Date().toLocaleTimeString();
</script>
</body>
</html>
